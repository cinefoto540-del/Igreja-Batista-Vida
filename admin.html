<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Igreja Batista Vida | Administrador</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

    /* Tela de Login */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-box {
      background: var(--card);
      padding: 32px 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    .login-box h2 { color: var(--primary); margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      padding: 24px 20px;
      text-align: center;
      position: relative;
    }
    header h1 { font-size: 1.7rem; margin-bottom: 4px; }
    header p { opacity: 0.9; font-size: 0.92rem; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.18);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-top: 10px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    .dot.offline { background: #facc15; }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255,255,255,0.18);
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .container { max-width: 1240px; margin: 24px auto; padding: 0 16px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-card span { font-size: 0.88rem; color: var(--muted); display: block; margin-bottom: 6px; font-weight: 600; }
    .stat-card strong { font-size: 1.9rem; color: var(--primary); }
    .stat-card.green strong { color: var(--success); }
    .stat-card.orange strong { color: var(--warning); }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card h2 {
      font-size: 1.15rem;
      color: var(--primary);
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.92rem;
    }
    textarea { resize: vertical; min-height: 68px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--primary-light);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.93; }
    button.cancel-btn { background: #64748b; margin-top: 6px; }

    .list { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
    .list-item {
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .list-item-info h4 { font-size: 0.95rem; margin-bottom: 2px; }
    .list-item-info p { font-size: 0.82rem; color: var(--muted); }
    .actions { display: flex; gap: 6px; }
    .actions button { width: auto; padding: 6px 10px; font-size: 0.8rem; }
    .btn-edit { background: var(--warning); }
    .btn-del { background: var(--danger); }
    .empty { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 16px 0; }

    @media (max-width: 640px) {
      .back-btn { position: static; display: inline-block; margin-bottom: 10px; }
    }
  </style>
</head>
<body>

  <!-- Tela de Senha -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>Área Administrador</h2>
      <p>Digite a senha para gerenciar o sistema</p>
      <input type="password" id="senhaInput" placeholder="Senha" />
      <button id="btnEntrar">Entrar</button>
    </div>
  </div>

  <!-- Painel Admin -->
  <div id="adminPanel" style="display:none;">
    <header>
      <a href="index.html" class="back-btn">← Voltar para Painel Principal</a>
      <h1>Área Administrador</h1>
      <p>Gestão de Eventos, Membros e Células</p>
      <div class="status-pill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Conectando à nuvem...</span>
      </div>
    </header>

    <div class="container">
      <div class="stats-grid">
        <div class="stat-card"><span>Total de Membros</span><strong id="totalMembros">0</strong></div>
        <div class="stat-card green"><span>Em Células</span><strong id="emCelulas">0</strong></div>
        <div class="stat-card orange"><span>Fora das Células</span><strong id="foraCelulas">0</strong></div>
        <div class="stat-card"><span>Total de Células</span><strong id="totalCelulas">0</strong></div>
      </div>

      <div class="grid-3">
        <!-- EVENTOS -->
        <div class="card">
          <h2>Eventos</h2>
          <form id="formEvento">
            <input type="hidden" id="eventoEditId" />
            <label>Nome do Evento *</label>
            <input type="text" id="evNome" placeholder="Ex: Culto de Celebração" required />
            <div class="row-2">
              <div>
                <label>Data *</label>
                <input type="date" id="evData" required />
              </div>
              <div>
                <label>Horário</label>
                <input type="time" id="evHora" />
              </div>
            </div>
            <label>Descrição / Local</label>
            <textarea id="evDesc" placeholder="Ex: Templo principal ou endereço"></textarea>
            <button type="submit" id="btnSalvarEvento">Adicionar Evento</button>
            <button type="button" class="cancel-btn" id="btnCancelarEvento" style="display:none;">Cancelar Edição</button>
          </form>
          <div class="list" id="listaEventos"></div>
        </div>

        <!-- MEMBROS -->
        <div class="card">
          <h2>Membros</h2>
          <form id="formMembro">
            <input type="hidden" id="membroEditId" />
            <label>Nome do Membro *</label>
            <input type="text" id="memNome" placeholder="Nome completo" required />
            <label>Telefone / WhatsApp</label>
            <input type="text" id="memTel" placeholder="(00) 90000-0000" maxlength="15" />
            <label>Célula</label>
            <select id="memCelula">
              <option value="Fora de célula">Fora de célula</option>
            </select>
            <button type="submit" id="btnSalvarMembro">Adicionar Membro</button>
            <button type="button" class="cancel-btn" id="btnCancelarMembro" style="display:none;">Cancelar Edição</button>
          </form>

          <div class="row-2" style="margin-top:16px;">
            <div>
              <label>Buscar por nome</label>
              <input type="text" id="filtroNome" placeholder="Filtrar nome..." />
            </div>
            <div>
              <label>Filtrar por célula</label>
              <select id="filtroCelula">
                <option value="Todas">Todas</option>
              </select>
            </div>
          </div>
          <div class="list" id="listaMembros"></div>
        </div>

        <!-- CÉLULAS -->
        <div class="card">
          <h2>Células</h2>
          <form id="formCelula">
            <input type="hidden" id="celulaEditId" />
            <label>Nome da Célula *</label>
            <input type="text" id="celNome" placeholder="Ex: Célula Betânia" required />
            <label>Líder da Célula</label>
            <input type="text" id="celLider" placeholder="Nome do líder" />
            <button type="submit" id="btnSalvarCelula">Criar Célula</button>
            <button type="button" class="cancel-btn" id="btnCancelarCelula" style="display:none;">Cancelar Edição</button>
          </form>
          <div class="list" id="listaCelulas"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const FIREBASE_DB_URL = "https://igreja-batista-vida-b184c-default-rtdb.firebaseio.com";
    const SENHA_ADMIN = "dede";

    const app = initializeApp({ databaseURL: FIREBASE_DB_URL });
    const db = getDatabase(app);

    let eventos = {};
    let membros = {};
    let celulas = {};

    // Login
    function liberarPainel() {
      sessionStorage.setItem("ibv_admin", "ok");
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
    }
    if (sessionStorage.getItem("ibv_admin") === "ok") liberarPainel();

    document.getElementById("btnEntrar").addEventListener("click", () => {
      if (document.getElementById("senhaInput").value === SENHA_ADMIN) {
        liberarPainel();
      } else {
        alert("Senha incorreta!");
      }
    });
    document.getElementById("senhaInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") document.getElementById("btnEntrar").click();
    });

    // Status conexão
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    onValue(ref(db, ".info/connected"), (snap) => {
      if (snap.val() === true) {
        statusDot.classList.remove("offline");
        statusText.textContent = "Sincronizado com a nuvem";
      } else {
        statusDot.classList.add("offline");
        statusText.textContent = "Reconectando...";
      }
    });

    // Escutar banco em tempo real
    onValue(ref(db, "igreja_dados"), (snapshot) => {
      const data = snapshot.val() || {};
      eventos = data.eventos || {};
      membros = data.membros || {};
      celulas = data.celulas || {};
      atualizarTudo();
    });

    // Máscara Telefone
    document.getElementById("memTel").addEventListener("input", (e) => {
      let v = e.target.value.replace(/\D/g, "");
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 6) v = `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;
      else if (v.length > 2) v = `(${v.slice(0,2)}) ${v.slice(2)}`;
      else if (v.length > 0) v = `(${v}`;
      e.target.value = v;
    });

    function atualizarTudo() {
      const listaM = Object.entries(membros);
      const listaC = Object.entries(celulas);
      const listaE = Object.entries(eventos);

      const emCelulaCount = listaM.filter(([, m]) => m.celula && m.celula !== "Fora de célula").length;
      document.getElementById("totalMembros").textContent = listaM.length;
      document.getElementById("emCelulas").textContent = emCelulaCount;
      document.getElementById("foraCelulas").textContent = listaM.length - emCelulaCount;
      document.getElementById("totalCelulas").textContent = listaC.length;

      // Atualiza selects de células
      const selCel = document.getElementById("memCelula");
      const filCel = document.getElementById("filtroCelula");
      const valAtual = selCel.value;
      const filAtual = filCel.value;

      selCel.innerHTML = '<option value="Fora de célula">Fora de célula</option>';
      filCel.innerHTML = '<option value="Todas">Todas</option><option value="Fora de célula">Fora de célula</option>';

      listaC.forEach(([, c]) => {
        selCel.innerHTML += `<option value="${c.nome}">${c.nome}</option>`;
        filCel.innerHTML += `<option value="${c.nome}">${c.nome}</option>`;
      });
      selCel.value = valAtual || "Fora de célula";
      filCel.value = filAtual || "Todas";

      // Render Eventos
      const elEv = document.getElementById("listaEventos");
      elEv.innerHTML = listaE.length ? listaE.map(([id, ev]) => `
        <div class="list-item">
          <div class="list-item-info">
            <h4>${ev.nome}</h4>
            <p>${ev.data.split("-").reverse().join("/")} ${ev.horario || ""}</p>
          </div>
          <div class="actions">
            <button type="button" class="btn-edit" onclick="editarEvento('${id}')">Editar</button>
            <button type="button" class="btn-del" onclick="excluirItem('eventos','${id}')">X</button>
          </div>
        </div>
      `).join("") : '<p class="empty">Nenhum evento cadastrado.</p>';

      // Render Células
      const elCel = document.getElementById("listaCelulas");
      elCel.innerHTML = listaC.length ? listaC.map(([id, c]) => `
        <div class="list-item">
          <div class="list-item-info">
            <h4>${c.nome}</h4>
            <p>Líder: ${c.lider || "Não informado"}</p>
          </div>
          <div class="actions">
            <button type="button" class="btn-edit" onclick="editarCelula('${id}')">Editar</button>
            <button type="button" class="btn-del" onclick="excluirItem('celulas','${id}')">X</button>
          </div>
        </div>
      `).join("") : '<p class="empty">Nenhuma célula cadastrada.</p>';

      renderMembros();
    }

    function renderMembros() {
      const fNome = document.getElementById("filtroNome").value.toLowerCase();
      const fCel = document.getElementById("filtroCelula").value;
      const filtrados = Object.entries(membros).filter(([, m]) => {
        const matchNome = m.nome.toLowerCase().includes(fNome);
        const matchCel = fCel === "Todas" || (m.celula || "Fora de célula") === fCel;
        return matchNome && matchCel;
      });
      const elMem = document.getElementById("listaMembros");
      elMem.innerHTML = filtrados.length ? filtrados.map(([id, m]) => `
        <div class="list-item">
          <div class="list-item-info">
            <h4>${m.nome}</h4>
            <p>${m.telefone || "Sem telefone"} • ${m.celula || "Fora de célula"}</p>
          </div>
          <div class="actions">
            <button type="button" class="btn-edit" onclick="editarMembro('${id}')">Editar</button>
            <button type="button" class="btn-del" onclick="excluirItem('membros','${id}')">X</button>
          </div>
        </div>
      `).join("") : '<p class="empty">Nenhum membro encontrado.</p>';
    }

    document.getElementById("filtroNome").addEventListener("input", renderMembros);
    document.getElementById("filtroCelula").addEventListener("change", renderMembros);

    // Salvar Evento
    document.getElementById("formEvento").addEventListener("submit", async (e) => {
      e.preventDefault();
      const editId = document.getElementById("eventoEditId").value;
      const dados = {
        nome: document.getElementById("evNome").value.trim(),
        data: document.getElementById("evData").value,
        horario: document.getElementById("evHora").value,
        descricao: document.getElementById("evDesc").value.trim()
      };
      const targetRef = editId ? ref(db, `igreja_dados/eventos/${editId}`) : push(ref(db, "igreja_dados/eventos"));
      await set(targetRef, dados);
      resetEvento();
    });

    function resetEvento() {
      document.getElementById("formEvento").reset();
      document.getElementById("eventoEditId").value = "";
      document.getElementById("btnSalvarEvento").textContent = "Adicionar Evento";
      document.getElementById("btnCancelarEvento").style.display = "none";
    }
    document.getElementById("btnCancelarEvento").addEventListener("click", resetEvento);

    // Salvar Membro
    document.getElementById("formMembro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const editId = document.getElementById("membroEditId").value;
      const dados = {
        nome: document.getElementById("memNome").value.trim(),
        telefone: document.getElementById("memTel").value.trim(),
        celula: document.getElementById("memCelula").value
      };
      const targetRef = editId ? ref(db, `igreja_dados/membros/${editId}`) : push(ref(db, "igreja_dados/membros"));
      await set(targetRef, dados);
      resetMembro();
    });

    function resetMembro() {
      document.getElementById("formMembro").reset();
      document.getElementById("membroEditId").value = "";
      document.getElementById("btnSalvarMembro").textContent = "Adicionar Membro";
      document.getElementById("btnCancelarMembro").style.display = "none";
    }
    document.getElementById("btnCancelarMembro").addEventListener("click", resetMembro);

    // Salvar Célula
    document.getElementById("formCelula").addEventListener("submit", async (e) => {
      e.preventDefault();
      const editId = document.getElementById("celulaEditId").value;
      const dados = {
        nome: document.getElementById("celNome").value.trim(),
        lider: document.getElementById("celLider").value.trim()
      };
      const targetRef = editId ? ref(db, `igreja_dados/celulas/${editId}`) : push(ref(db, "igreja_dados/celulas"));
      await set(targetRef, dados);
      resetCelula();
    });

    function resetCelula() {
      document.getElementById("formCelula").reset();
      document.getElementById("celulaEditId").value = "";
      document.getElementById("btnSalvarCelula").textContent = "Criar Célula";
      document.getElementById("btnCancelarCelula").style.display = "none";
    }
    document.getElementById("btnCancelarCelula").addEventListener("click", resetCelula);

    // Funções globais de edição/exclusão
    window.editarEvento = (id) => {
      const ev = eventos[id];
      document.getElementById("eventoEditId").value = id;
      document.getElementById("evNome").value = ev.nome;
      document.getElementById("evData").value = ev.data;
      document.getElementById("evHora").value = ev.horario || "";
      document.getElementById("evDesc").value = ev.descricao || "";
      document.getElementById("btnSalvarEvento").textContent = "Salvar Alterações";
      document.getElementById("btnCancelarEvento").style.display = "block";
    };

    window.editarMembro = (id) => {
      const m = membros[id];
      document.getElementById("membroEditId").value = id;
      document.getElementById("memNome").value = m.nome;
      document.getElementById("memTel").value = m.telefone || "";
      document.getElementById("memCelula").value = m.celula || "Fora de célula";
      document.getElementById("btnSalvarMembro").textContent = "Salvar Alterações";
      document.getElementById("btnCancelarMembro").style.display = "block";
    };

    window.editarCelula = (id) => {
      const c = celulas[id];
      document.getElementById("celulaEditId").value = id;
      document.getElementById("celNome").value = c.nome;
      document.getElementById("celLider").value = c.lider || "";
      document.getElementById("btnSalvarCelula").textContent = "Salvar Alterações";
      document.getElementById("btnCancelarCelula").style.display = "block";
    };

    window.excluirItem = async (tipo, id) => {
      if (confirm("Deseja realmente excluir este item?")) {
        await remove(ref(db, `igreja_dados/${tipo}/${id}`));
      }
    };
  </script>
</body>
</html>
